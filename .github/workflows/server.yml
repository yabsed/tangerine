name: Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infra/**'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: carrot
          MYSQL_ROOT_PASSWORD: test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    env:
      ENV: test

      DB_DIALECT: mysql
      DB_DRIVER: aiomysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: carrot
      DB_USER: root
      DB_PASSWORD: test-password

      FRONTEND_URL: https://yabsed.github.io/tangerine/
      ACCESS_TOKEN_SECRET: isolated-ci-access-secret
      REFRESH_TOKEN_SECRET: isolated-ci-refresh-secret
      SESSION_SECRET: isolated-ci-session-secret

      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      S3_IMAGE_BUCKET: test-images

      SMOKE_PASSWORD: integration-test-123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - run: pip install -r server/requirements.txt

      - name: Test API and migrations
        run: bash infra/test.sh

  build:
    name: Server build
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: infra/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy server
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      IMAGE: ${{ needs.build.outputs.image }}
      S3_IMAGE_BUCKET: dangeun-images-8c4e6a29

    steps:
      - uses: actions/checkout@v4

      - name: Deliver and deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash infra/deliver.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify the public deployment
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          pip install httpx==0.28.1 websockets==15.0.1
          curl --fail --silent --show-error --output /dev/null \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$API_ORIGIN/api/health"
          python infra/smoke.py "$API_ORIGIN" https://yabsed.github.io --images
